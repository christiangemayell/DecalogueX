# pyproject.toml: the project's build file.
#
# JAVA COMPARISON: this is Python's version of a Maven pom.xml or a Gradle
# build file. It names the project, lists its dependencies, and says which
# function runs when someone types the `decaloguex` command.
#
# It's also the "shop listing" for PyPI (pip's app store): the description,
# keywords and links below are what people see on pypi.org/project/decaloguex.

[build-system]
# The tool that turns this folder into an installable package (like the
# Maven compiler plugin). pip downloads it automatically when needed.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decaloguex"
version = "0.2.0"  # keep in sync with decaloguex/__init__.py and npm/package.json
description = "Crash Doctor: finds and fixes the security and crash bugs AI coding tools leave behind."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "christiangemayell" }]
requires-python = ">=3.10"
keywords = ["security", "linter", "ai", "vibe-coding", "sql-injection", "secrets", "code-fixer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Runtime dependencies (Maven's <dependencies>). Tree-sitter is the parser
# that reads source code into a tree, with one grammar per language.
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-swift>=0.7",
]

[project.urls]
# Change these if your GitHub repository ends up with a different name.
Homepage = "https://github.com/christiangemayell/decaloguex"
Issues = "https://github.com/christiangemayell/decaloguex/issues"

[project.optional-dependencies]
# Extra packages only needed while developing (like Maven's <scope>test</scope>).
# Install with:  pip install -e ".[dev]"
dev = ["pytest>=8"]

[project.scripts]
# Creates a `decaloguex` command that calls main() in decaloguex/cli.py.
# Similar to setting Main-Class in a JAR manifest.
decaloguex = "decaloguex.cli:main"

[tool.setuptools.packages.find]
# Only ship the decaloguex package, not the tests.
include = ["decaloguex*"]

[tool.pytest.ini_options]
# Where pytest (Python's JUnit) looks for tests.
testpaths = ["tests"]
